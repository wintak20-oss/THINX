services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vue_ui
    ports:
      - "8081:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: "http://localhost:5000"
    networks:
      - app_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flask_api
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/workspace
    working_dir: /workspace
    environment:
      FLASK_APP: app.py
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      AGRAPH_HOST: agraph
      AGRAPH_PORT: "10035"
      AGRAPH_SUPER_USER: ${AGRAPH_SUPER_USER}
      AGRAPH_SUPER_PASSWORD: ${AGRAPH_SUPER_PASSWORD}
      AGRAPH_REPOSITORY: ${AGRAPH_REPOSITORY}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    external: true
    name: fdppv1_default